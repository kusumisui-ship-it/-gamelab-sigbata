<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b0c0e">
  <meta name="description" content="gamelab.sig — 攻略ではなく、研究する。Apex Legendsの仮説と検証を共有するテスト版コミュニティ。">
  <title>gamelab.sig — Apex Test Build</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="research-box.css">
  <link rel="stylesheet" href="ui-refresh.css">
  <link rel="stylesheet" href="research-flow.css">
  <link rel="stylesheet" href="research-canvas.css">
  <link rel="stylesheet" href="draft-recovery.css">
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <button class="brand" type="button" data-route="home" aria-label="ホームへ">
        <span class="brand-mark" aria-hidden="true">G<span>R</span></span>
        <span class="brand-copy">
          <strong>gamelab.sig</strong>
          <small>APEX STRATEGY LAB</small>
        </span>
      </button>

      <div class="top-actions">
        <button id="gameButton" class="game-button" type="button" aria-label="対応ゲーム：Apex Legends" disabled>
          <span id="gameInitial" class="game-initial">A</span>
          <span id="gameName">APEX</span>
        </button>
        <button class="avatar-button" type="button" data-route="profile" aria-label="プロフィール">
          <span id="headerAvatar">S</span>
        </button>
      </div>
    </header>

    <main id="app" class="main" tabindex="-1"></main>

    <nav class="bottom-nav" aria-label="メインナビゲーション">
      <button class="nav-item active" type="button" data-route="home" aria-label="ホーム">
        <span aria-hidden="true">⌂</span><small>HOME</small>
      </button>
      <button class="nav-item" type="button" data-route="rb" aria-label="Research Board">
        <span aria-hidden="true">#</span><small>RB</small>
      </button>
      <button id="composeButton" class="nav-compose" type="button" aria-label="投稿する">
        <span aria-hidden="true">＋</span>
      </button>
      <button class="nav-item" type="button" data-route="search" aria-label="検索">
        <span aria-hidden="true">⌕</span><small>SEARCH</small>
      </button>
      <button class="nav-item" type="button" data-route="notice" aria-label="通知">
        <span aria-hidden="true">◇</span><small>NOTICE</small>
        <i id="noticeDot" class="notice-dot" hidden></i>
      </button>
    </nav>
  </div>

  <div id="modalRoot"></div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script src="data-store.js"></script>
  <script src="script.js"></script>
  <script src="research-box.js"></script>
  <script src="ui-refresh.js"></script>
  <script src="research-flow.js"></script>
  <script src="research-canvas.js"></script>
  <script src="draft-recovery.js"></script>
  <script src="apex-only.js"></script>
</body>
</html>
